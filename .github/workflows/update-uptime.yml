
name: Update GitHub Account Uptime

'on':
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-uptime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Calculate account uptime
        env:
          GITHUB_USERNAME: akashbondada1234
        run: python scripts/update_uptime.py

      - name: Commit updated SVG if changed
        run: |
          if git diff --quiet -- dark_mode.svg; then
            echo "Uptime SVG is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg
          git commit -m "Update GitHub account uptime"
          git push
